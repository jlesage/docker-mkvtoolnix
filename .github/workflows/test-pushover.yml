name: Test Pushover notification

on:
  workflow_dispatch:

jobs:
  notify:
    name: Send test notification
    runs-on: ubuntu-22.04
    steps:
      - name: Pushover notification
        env:
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            https://api.pushover.net/1/messages.json \
            -F "token=${PUSHOVER_API_TOKEN}" \
            -F "user=${PUSHOVER_USER_KEY}" \
            -F "title=MKVToolNix version check" \
            -F "message=Test notification." \
            -F "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "url_title=View run"
